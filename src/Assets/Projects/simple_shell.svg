<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#a5b4fc" points="0 0 10 3.5 0 7"/></marker></defs><rect width="800" height="500" fill="#1e1b4b"/><g transform="translate(50,50)"><rect width="200" height="120" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">SHELL PROCESS</text><rect width="160" height="60" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="12">PID: parent</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="12">$ command args</text></g><g transform="translate(300,50)"><rect width="200" height="120" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">PARSER</text><rect width="160" height="60" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="10">1. Split command line</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="10">2. Parse PATH</text></g><g transform="translate(550,50)"><rect width="200" height="120" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">FORK()</text><rect width="160" height="60" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="10">Create child process</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="10">Return new PID</text></g><g transform="translate(550,250)"><rect width="200" height="120" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">CHILD PROCESS</text><rect width="160" height="60" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="10">execve(path, args)</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="10">Execute command</text></g><g transform="translate(50,250)"><rect width="200" height="120" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">PARENT PROCESS</text><rect width="160" height="60" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="10">wait(status)</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="10">Handle exit code</text></g><path stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 250,110 L 290,110"/><path stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 500,110 L 540,110"/><path stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 650,170 L 650,240"/><path fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 650,170 L 250,310"/></svg>
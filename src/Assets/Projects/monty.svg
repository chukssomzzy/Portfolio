<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#a5b4fc" points="0 0 10 3.5 0 7"/></marker></defs><rect width="800" height="500" fill="#1e1b4b"/><g transform="translate(50,50)"><rect width="200" height="120" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">INPUT BYTECODE</text><rect width="160" height="60" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="12">push 72</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="12">pchar</text><text x="30" y="95" fill="#a5b4fc" font-family="monospace" font-size="12">...</text></g><g transform="translate(300,30)"><rect width="200" height="160" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">PARSER</text><rect width="160" height="100" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="10">1. Split line into tokens</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="10">2. Validate operation</text><text x="30" y="105" fill="#a5b4fc" font-family="monospace" font-size="10">3. Parse arguments</text><text x="30" y="125" fill="#a5b4fc" font-family="monospace" font-size="10">4. Execute operation</text></g><g transform="translate(550,50)"><rect width="200" height="400" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">STACK MEMORY</text><rect width="160" height="320" x="20" y="50" fill="#1e1b4b" rx="2"/><g transform="translate(40,340)"><rect width="120" height="20" x="0" y="0" fill="#4338ca" rx="2"/><text x="60" y="15" fill="#e0e7ff" font-family="monospace" font-size="12" text-anchor="middle">0x7FFF</text></g><g transform="translate(40,310)"><rect width="120" height="20" x="0" y="0" fill="#4338ca" rx="2"/><text x="60" y="15" fill="#e0e7ff" font-family="monospace" font-size="12" text-anchor="middle">0x7FFE</text></g><text x="100" y="200" fill="#6366f1" font-family="monospace" font-size="20" text-anchor="middle">...</text></g><g transform="translate(50,200)"><rect width="200" height="250" x="0" y="0" fill="#312e81" rx="4"/><text x="100" y="30" fill="#e0e7ff" font-family="monospace" font-size="14" text-anchor="middle">INSTRUCTION SET</text><rect width="160" height="190" x="20" y="45" fill="#1e1b4b" rx="2"/><text x="30" y="65" fill="#a5b4fc" font-family="monospace" font-size="12">push → 0x01</text><text x="30" y="85" fill="#a5b4fc" font-family="monospace" font-size="12">pall → 0x02</text><text x="30" y="105" fill="#a5b4fc" font-family="monospace" font-size="12">pint → 0x03</text><text x="30" y="125" fill="#a5b4fc" font-family="monospace" font-size="12">swap → 0x04</text><text x="30" y="145" fill="#a5b4fc" font-family="monospace" font-size="12">pchar → 0x05</text><text x="30" y="165" fill="#a5b4fc" font-family="monospace" font-size="12">...</text></g><path stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 250,110 L 290,110"/><path stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 500,110 L 540,110"/><path fill="none" stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrowhead)" d="M 400,190 L 400,220 L 540,220"/></svg>